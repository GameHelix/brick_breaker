<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#1a0a2e"/>

  <!-- Bricks -->
  <rect x="10" y="15" width="18" height="8" fill="#FF6B6B" rx="1"/>
  <rect x="30" y="15" width="18" height="8" fill="#4ECDC4" rx="1"/>
  <rect x="50" y="15" width="18" height="8" fill="#F7DC6F" rx="1"/>
  <rect x="70" y="15" width="18" height="8" fill="#BB8FCE" rx="1"/>

  <rect x="10" y="26" width="18" height="8" fill="#45B7D1" rx="1"/>
  <rect x="30" y="26" width="18" height="8" fill="#FFA07A" rx="1"/>
  <rect x="50" y="26" width="18" height="8" fill="#98D8C8" rx="1"/>
  <rect x="70" y="26" width="18" height="8" fill="#85C1E2" rx="1"/>

  <!-- Ball with glow -->
  <circle cx="50" cy="55" r="6" fill="url(#grad1)">
    <animate attributeName="cy" values="55;50;55" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="55" r="8" fill="url(#grad1)" opacity="0.3">
    <animate attributeName="cy" values="55;50;55" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Paddle -->
  <rect x="35" y="78" width="30" height="4" fill="#00ffff" rx="2">
    <animate attributeName="x" values="35;40;35;30;35" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="35" y="78" width="30" height="4" fill="#00ffff" opacity="0.4" rx="2">
    <animate attributeName="x" values="35;40;35;30;35" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
